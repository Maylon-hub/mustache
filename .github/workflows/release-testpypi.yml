name: Publish release candidate to TestPyPI

on:
  push:
    tags:
      - "v*rc*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mustache-core
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Validate package version
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["EXPECTED_VERSION"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              actual = tomllib.load(fh)["project"]["version"]
          if actual != expected:
              raise SystemExit(f"Version mismatch: tag={expected}, package={actual}")
          PY

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
