[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mustache-core"
version = "0.1.1"
description = "MustaCHE (Multiple Cluster Hierarchies Explorer) integrated with Core-SG"
authors = [
    {name = "MustaCHE Authors", email = "authors@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "core-sg-mustache>=0.2.0rc1",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "plotly"
]

[project.scripts]
mustache = "mustache.cli:main"

[tool.setuptools]
packages = ["mustache", "mustache.core"]
include-package-data = true

[tool.setuptools.package-data]
mustache = ["static/**/*", "templates/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-flask>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
