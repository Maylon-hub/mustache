{% extends "base.html" %}

{% block content %}
<div class="mustache-layout">
    <!-- Top Pane: Dendrogram (Meta-Clusters) -->
    <div class="pane pane-top card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap py-2">
            <div class="d-flex align-items-center flex-wrap">
                <span class="mr-3 font-weight-bold"><i class="fas fa-sitemap mr-1"></i> Dendrogram</span>
                <!-- Interactive Toolbar inspired by Legacy 2017 -->
                <div class="btn-group btn-group-sm mr-2 my-1" role="group" aria-label="Tools">
                    <button id="btn-tool-wand" type="button" class="btn btn-light border active" title="Select / Highlight Branches" onclick="setDendroTool('select')">
                        <i class="fas fa-magic text-primary"></i>
                    </button>
                    <button id="btn-tool-cut" type="button" class="btn btn-light border" title="Adjust Cut Threshold Line" onclick="setDendroTool('cut')">
                        <i class="fas fa-arrows-alt-v text-danger"></i>
                    </button>
                    <button id="btn-tool-pan" type="button" class="btn btn-light border" title="Pan / Drag" onclick="setDendroTool('pan')">
                        <i class="fas fa-hand-paper text-secondary"></i>
                    </button>
                </div>
                <!-- Zoom Controls -->
                <div class="btn-group btn-group-sm mr-2 my-1" role="group" aria-label="Zoom">
                    <button type="button" class="btn btn-light border" title="Zoom In" onclick="zoomDendrogram(1.25)">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button type="button" class="btn btn-light border" title="Zoom Out" onclick="zoomDendrogram(0.8)">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <button type="button" class="btn btn-light border" title="Reset Zoom (100%)" onclick="resetDendrogramZoom()">
                        100%
                    </button>
                </div>
                <span id="selected-branches-badge" class="badge badge-info my-1 ml-1" style="display:none;">0 branches selected</span>
            </div>
            <div class="d-flex align-items-center my-1">
                <button id="btn-export-csv" class="btn btn-sm btn-outline-success mr-2" onclick="exportSelectedBranchesCSV()" title="Export Cluster Labels as CSV">
                    <i class="fas fa-download"></i> Export CSV
                </button>
                <button class="btn btn-sm btn-primary" onclick="openBatchConfigModal()"><i class="fas fa-layer-group"></i> Run Batch</button>
            </div>
        </div>
        <div class="card-body p-0">
            <div id="meta-dendrogram" style="height: 400px; width: 100%;"></div>
        </div>
    </div>

    <!-- Bottom Panes -->
    <div class="pane-bottom-container">
        <!-- Bottom Left: HAI Matrix -->
        <div class="pane pane-bottom-left card">
            <div class="card-header"><i class="fas fa-th mr-1"></i> HAI Plot</div>
            <div class="card-body p-0">
                <div id="hai-heatmap" style="height: 400px; width: 100%;"></div>
            </div>
        </div>

        <!-- Bottom Right: Reachability Plots -->
        <div class="pane pane-bottom-right card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-chart-area mr-1"></i> Reachability Plots</span>
                <span id="cache-indicator" class="badge badge-light border text-muted" style="font-size: 0.75rem;"></span>
            </div>
            <div class="card-body p-0">
                <!-- We will append multiple reachability plots here side-by-side -->
                <div id="reachability-container" class="d-flex" style="overflow-x: auto; height: 400px;">
                    <!-- JS will populate individual reachability plots -->
                    <div class="text-muted p-3">Run Batch Analysis to generate meta-clusters.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Configuration Modal for Batch -->
<div class="modal fade" id="batchConfigModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Configure Multiple Clustering Hierarchies Explorer</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="batch-form" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Dataset (CSV) <span class="required">*</span></label>
                                <input type="file" class="form-control-file" name="file" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Algorithm</label>
                                <select class="form-control" name="algorithm">
                                    <option value="hdbscan">HDBSCAN</option>
                                    <option value="core-sg">Core-SG</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Min <code>mpts</code></label>
                                <input type="number" class="form-control" name="min_mpts" value="2" min="2">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Max <code>mpts</code></label>
                                <input type="number" class="form-control" name="max_mpts" value="50" min="2">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Step Size</label>
                                <input type="number" class="form-control" name="step" value="2" min="1">
                            </div>
                        </div>
                    </div>
                    <div class="text-right mt-3">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success"><i class="fas fa-play"></i> Run Explore</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% if project_id %}
<script>
// Auto-load saved project when page opens with ?project_id=
document.addEventListener('DOMContentLoaded', async () => {
    const projectId = "{{ project_id }}";
    if (!projectId) return;

    // Show loading indicator
    const dendroDiv = document.getElementById('meta-dendrogram');
    if (dendroDiv) {
        dendroDiv.innerHTML = '<div class="d-flex align-items-center justify-content-center h-100 text-muted"><i class="fas fa-spinner fa-spin mr-2"></i> Loading saved analysis...</div>';
    }

    try {
        const res = await fetch(`/api/projects/${projectId}/data`);
        if (!res.ok) throw new Error('Project not found');
        const data = await res.json();

        const analysis = data.analysis || {};
        const results = data.results || {};
        const meta = data.metadata || {};

        // Restore analysis globals (accessed via main.js DOMContentLoaded scope)
        // We dispatch a custom event that main.js listens for
        const event = new CustomEvent('mustache:project-loaded', {
            detail: { analysis, results, metadata: meta }
        });
        document.dispatchEvent(event);

        // Update sidebar info
        const projName = document.getElementById('proj-name');
        const projTime = document.getElementById('proj-min-mpts');
        if (projName) projName.innerText = meta.name || 'Loaded Project';
        if (projTime) projTime.innerText = meta.mpts_min || '-';

        // Reveal save button
        const sidebarSaveBtn = document.getElementById('btn-sidebar-save');
        if (sidebarSaveBtn) sidebarSaveBtn.style.display = 'inline-block';

    } catch (err) {
        console.error('Failed to load project:', err);
        if (dendroDiv) dendroDiv.innerHTML = '<div class="text-danger p-3"><i class="fas fa-exclamation-triangle mr-2"></i> Failed to load saved project: ' + err.message + '</div>';
    }
});
</script>
{% endif %}
{% endblock %}
